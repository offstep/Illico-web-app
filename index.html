<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILLICO Workforce</title>
  <!-- Tailwind CSS (Le design) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icônes -->
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <!-- Nos styles persos -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8f9fa] text-zinc-900 pb-24 font-sans antialiased">

  <!-- Écran de connexion -->
  <div id="login-screen" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-3xl font-black italic text-white mb-2">ILLICO</h1>
    <p class="text-zinc-400 mb-8">Connecte-toi pour accéder au dashboard</p>

    <button id="login-btn" onclick="loginWithGoogle()" class="invisible bg-white text-black px-6 py-3 rounded-full font-bold flex items-center gap-2 hover:bg-gray-200 transition">
      Se connecter avec Google
    </button>
  </div>

  <!-- Contenu principal (caché tant que non connecté) -->
  <div id="main-content" class="hidden">

  <!-- Header Noir (Style Offstep) -->
  <header class="bg-black text-white px-6 pt-12 pb-8 rounded-b-[2.5rem] shadow-lg relative overflow-hidden">
    <div class="flex justify-between items-center mb-6">
      <div class="relative">
        <i data-lucide="bell" class="w-6 h-6"></i>
        <span class="absolute -top-1 -right-1 bg-white text-black text-[10px] font-bold px-1.5 rounded-full">3</span>
      </div>
      <h1 class="text-2xl font-black italic tracking-tighter">ILLICO</h1>
      <div class="flex gap-4">
        <i data-lucide="search" class="w-6 h-6"></i>
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
      </div>
    </div>
    <div id="user-info" class="hidden text-center"></div>
  </header>

  <main class="px-5 -mt-6 relative z-20 space-y-6">
    
    <!-- Compte à rebours -->
    <div class="bg-[#0b132b] rounded-[2rem] p-6 text-center shadow-xl">
      <h2 class="text-white font-semibold mb-4 text-sm">Avant la fin de la version bêta</h2>
      <div class="flex justify-center gap-2">
        <div class="bg-[#1a2542] rounded-xl w-16 h-20 flex flex-col items-center justify-center border border-[#2a3a66]">
          <span class="text-white text-2xl font-bold" id="days">00</span>
          <span class="text-[9px] text-zinc-400 font-semibold tracking-wider">JOURS</span>
        </div>
        <div class="bg-[#1a2542] rounded-xl w-16 h-20 flex flex-col items-center justify-center border border-[#2a3a66]">
          <span class="text-white text-2xl font-bold" id="hours">13</span>
          <span class="text-[9px] text-zinc-400 font-semibold tracking-wider">HEURES</span>
        </div>
        <div class="bg-[#1a2542] rounded-xl w-16 h-20 flex flex-col items-center justify-center border border-[#2a3a66]">
          <span class="text-white text-2xl font-bold" id="minutes">28</span>
          <span class="text-[9px] text-zinc-400 font-semibold tracking-wider">MIN</span>
        </div>
        <div class="bg-[#1a2542] rounded-xl w-16 h-20 flex flex-col items-center justify-center border border-[#2a3a66]">
          <span class="text-white text-2xl font-bold" id="seconds">56</span>
          <span class="text-[9px] text-zinc-400 font-semibold tracking-wider">SEC</span>
        </div>
      </div>
    </div>

    <!-- Section Stats (Scroll horizontal) -->
    <div>
      <h3 class="text-xl font-bold mb-3 px-1">Vue d'ensemble</h3>
      <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 px-1">
        <div class="bg-white border border-zinc-200 rounded-2xl px-5 py-3 min-w-[130px] shadow-sm">
          <div class="text-xs text-zinc-500 mb-1">Workers actifs</div>
          <div class="text-2xl font-bold">12</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-2xl px-5 py-3 min-w-[130px] shadow-sm">
          <div class="text-xs text-zinc-500 mb-1">Missions</div>
          <div class="text-2xl font-bold">4</div>
        </div>
        <div class="bg-white border border-zinc-200 rounded-2xl px-5 py-3 min-w-[130px] shadow-sm">
          <div class="text-xs text-zinc-500 mb-1">Paiements</div>
          <div class="text-lg font-bold">$1,250</div>
        </div>
      </div>
    </div>

    <!-- Carte 3D / Image -->
    <div class="card-3d bg-white rounded-[2rem] overflow-hidden shadow-lg border border-zinc-100 relative h-64 flex flex-col justify-end p-5">
      <!-- Effet de fond 3D / Gradient -->
      <div class="absolute inset-0 bg-gradient-to-tr from-violet-600 to-indigo-900 opacity-90"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <i data-lucide="box" class="w-24 h-24 text-white opacity-20 animate-pulse"></i>
      </div>
      
      <div class="relative z-10 bg-white/20 backdrop-blur-md rounded-xl p-4 border border-white/30 text-white">
        <h4 class="font-bold text-sm">Nouvelle mission STANDARD</h4>
        <p class="text-xs opacity-80">Prête à être publiée</p>
      </div>
    </div>

  </main>

  <!-- Navigation Flottante -->
  <nav class="fixed bottom-4 inset-x-4 bg-white/90 backdrop-blur-md rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-zinc-200 px-2 py-3 z-50">
    <ul class="flex justify-around items-center text-zinc-400">
      <li>
        <a href="#" aria-current="page" class="text-blue-600 flex flex-col items-center gap-1">
          <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-medium">Accueil</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center gap-1 hover:text-zinc-900">
          <i data-lucide="layout-grid" class="w-5 h-5"></i><span class="text-[10px] font-medium">Workers</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center gap-1 hover:text-zinc-900">
          <i data-lucide="camera" class="w-5 h-5"></i><span class="text-[10px] font-medium">Missions</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center gap-1 hover:text-zinc-900">
          <i data-lucide="file-text" class="w-5 h-5"></i><span class="text-[10px] font-medium">QA</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex flex-col items-center gap-1 hover:text-zinc-900">
          <i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-medium">Compte</span>
        </a>
      </li>
    </ul>
  </nav>

  </div><!-- fin main-content -->

  <!-- Supabase (librairie puis connexion) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>

  <!-- Notre script JS -->
  <script src="app.js"></script>
  <script>
    // Initialisation des icônes
    lucide.createIcons();
  </script>
</body>
</html>
